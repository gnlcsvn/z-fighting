<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Bildmarke erzeugen</title></head>
<body style="font-family: monospace">
<p id="stand">lade ...</p>
<!-- Erzeugt ziel.mind aus ziel.png (Merkmale fuer die Bilderkennung) und schickt die Datei an server.py. -->
<script type="module">
import { Compiler } from "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js";
const stand = document.getElementById("stand");
try {
  const bild = new Image(); bild.src = "ziel.png"; await bild.decode();
  const c = new Compiler();
  const daten = await c.compileImageTargets([bild], p => { stand.textContent = "rechne " + p.toFixed(0) + " %"; });
  const puffer = await c.exportData();
  const r = await fetch("/ziel.mind", { method: "POST", body: puffer });
  const merkmale = daten[0].matchingData.reduce((s, m) => s + m.maximaPoints.length + m.minimaPoints.length, 0);
  window.ergebnis = { bytes: await r.text(), merkmale, spurBilder: daten[0].trackingData.length };
  stand.textContent = "fertig: " + JSON.stringify(window.ergebnis);
} catch (e) { window.ergebnis = { fehler: String(e) }; stand.textContent = "Fehler: " + e; }
</script>
</body></html>
